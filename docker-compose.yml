services:
  mongodb:
    image: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - mongodb

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: /bin/sh -c "ollama serve & sleep 5 && ollama pull llama3.2 && wait"

  ai_agents:
    build:
      context: ./ai_agents
    ports:
      - "8001:8000"
    depends_on:
      - ollama
    environment:
      OLLAMA_URL: http://ollama:11434/api/generate
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2

volumes:
  mongodb_data:
  ollama_data:
